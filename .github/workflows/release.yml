name: Build extension release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Validate and package extension
        env:
          EXTENSION_PRIVATE_KEY: ${{ secrets.EXTENSION_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./src/manifest.json').version")"

          if [[ "$manifest_version" != "$version" ]]; then
            echo "Manifest version ($manifest_version) does not match tag (v$version)." >&2
            exit 1
          fi

          if [[ -z "$EXTENSION_PRIVATE_KEY" ]]; then
            echo "The EXTENSION_PRIVATE_KEY secret is required." >&2
            exit 1
          fi

          mkdir -p build
          printf '%s' "$EXTENSION_PRIVATE_KEY" | base64 --decode > build/extension.pem
          cp -R src build/extension

          chrome \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --pack-extension="$GITHUB_WORKSPACE/build/extension" \
            --pack-extension-key="$GITHUB_WORKSPACE/build/extension.pem"

          mv build/extension.crx "robux-masker-v${version}.crx"
          (
            cd build/extension
            zip -qr "../../robux-masker-v${version}.zip" .
          )
          rm -rf build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            robux-masker-*.crx
            robux-masker-*.zip