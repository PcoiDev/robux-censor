name: Build extension release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package extension
        env:
          EXTENSION_PRIVATE_KEY: ${{ secrets.EXTENSION_PRIVATE_KEY }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$EXTENSION_PRIVATE_KEY" ]]; then
            echo "The EXTENSION_PRIVATE_KEY secret is required." >&2
            exit 1
          fi

          version="${TAG#v}"
          manifest_version="$(node -p "require('./src/manifest.json').version")"
          if [[ "$manifest_version" != "$version" ]]; then
            echo "::warning::Manifest version ($manifest_version) does not match release tag ($TAG)."
          fi

          mkdir -p build

          # Accept the key either as raw PEM or base64-encoded PEM.
          # Normalise line endings and stray indentation from copy/paste.
          key="$(printf '%s' "$EXTENSION_PRIVATE_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [[ "$key" == *"-----BEGIN"* ]]; then
            printf '%s\n' "$key" > build/extension.raw.pem
          else
            printf '%s' "$key" | tr -d '\n ' | base64 --decode > build/extension.raw.pem || true
          fi

          if ! openssl pkey -in build/extension.raw.pem -out build/extension.pem 2> build/openssl.err; then
            echo "::error::EXTENSION_PRIVATE_KEY is not a valid PEM private key." >&2
            echo "Diagnostic (no key material shown):" >&2
            echo "  bytes: $(wc -c < build/extension.raw.pem)" >&2
            echo "  lines: $(wc -l < build/extension.raw.pem)" >&2
            echo "  first line: $(head -n1 build/extension.raw.pem | cut -c1-40)" >&2
            echo "  last line:  $(tail -n1 build/extension.raw.pem | cut -c1-40)" >&2
            echo "  openssl: $(cat build/openssl.err)" >&2
            echo "Expected ~28 lines starting with '-----BEGIN PRIVATE KEY-----' and ending with '-----END PRIVATE KEY-----'." >&2
            exit 1
          fi

          (
            cd src
            zip -qr "../robux-censor-${TAG}.zip" .
          )

          npx --yes crx3 --keyPath build/extension.pem --crxPath "robux-censor-${TAG}.crx" src

          rm -rf build
          ls -la robux-censor-"${TAG}".*

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            robux-censor-${{ github.event.release.tag_name }}.crx
            robux-censor-${{ github.event.release.tag_name }}.zip
