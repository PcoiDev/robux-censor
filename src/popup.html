<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Robux Censor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f1f1f;
      --muted: #6b6b6b;
      --border: #e3e3e3;
      --track: #c9c9c9;
      --track-on: #2e9e5b;
      --knob: #ffffff;
      --link: #1a5fd6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --fg: #e8eaed;
        --muted: #9aa0a6;
        --border: #3c4043;
        --track: #5f6368;
        --track-on: #3fb26d;
        --knob: #ffffff;
        --link: #8ab4f8;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 240px;
      padding: 14px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    header img {
      width: 28px;
      height: 28px;
      display: block;
      flex: none;
    }

    .title {
      flex: 1;
      min-width: 0;
    }

    .title h1 {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
    }

    .title span {
      display: block;
      font-size: 12px;
      color: var(--muted);
    }

    .switch {
      position: relative;
      width: 34px;
      height: 18px;
      flex: none;
    }

    .switch input {
      position: absolute;
      inset: 0;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .switch .track {
      position: absolute;
      inset: 0;
      border-radius: 9px;
      background: var(--track);
      transition: background 120ms;
    }

    .switch .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--knob);
      transition: transform 120ms;
    }

    .switch input:checked+.track {
      background: var(--track-on);
    }

    .switch input:checked+.track::after {
      transform: translateX(16px);
    }

    .switch input:focus-visible+.track {
      outline: 2px solid var(--track-on);
      outline-offset: 2px;
    }

    .note {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .note strong {
      color: var(--fg);
    }

    footer {
      margin-top: 10px;
      font-size: 12px;
    }

    footer a {
      color: var(--link);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <label>
    <header>
      <img src="icons/48.png" alt="">
      <div class="title">
        <h1>Robux Censor</h1>
        <span id="status">Enabled</span>
      </div>
      <span class="switch">
        <input type="checkbox" id="toggle" checked>
        <span class="track"></span>
      </span>
    </header>
  </label>

  <p class="note"><strong>Note:</strong> Replaces your <b>Robux balance</b> and <b>transaction amounts</b> with ??? on roblox.com. Everything stays in your browser: <b>nothing is sent or changed</b> on your account.</p>

  <footer>
    <a href="https://github.com/PcoiDev/robux-censor" target="_blank" rel="noopener">View source code</a>
  </footer>

  <script src="popup.js"></script>
</body>

</html>
